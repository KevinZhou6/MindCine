pretrained_model_path: "/userhome2/zhoutianyi/huggingface/stable-diffusion-v1-4"
output_dir: "./outputs/speciallast7_classes_500_epoch/"

train_data:
  video_path: "/userhome/zhoutianyi/Zhoutianyi/dataset/SEED-DV/output/block1/163.mp4"
  prompt: "a turtle swimming in the water"
  n_sample_frames: 6
  width: 512
  height: 288
  sample_start_idx: 0
  sample_frame_rate: 2

validation_data:
  prompts:
    - "a long road with a sunset in the background"
    - "a watermelon"
    - "a person is playing drums"
    - "a man playing a guitar"
    - "a man playing a piano in front of a keyboard"
    - "a person riding a motorcycle down a street"
    - "hot air balloons in the sky"

  video_length: 6
  width: 512
  height:  288
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: False
  num_inv_steps: 50

learning_rate: 3e-5
train_batch_size: 10
max_train_steps: 500
checkpointing_steps: 1000
validation_steps: 100
trainable_modules:
  - "attn1.to_q"
  - "attn2.to_q"
  - "attn_temp"

seed: 33
mixed_precision: fp16
use_8bit_adam: False
gradient_checkpointing: True
enable_xformers_memory_efficient_attention: True
